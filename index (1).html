<style>
:root{--bg:#0b0b10;--card:#16161d;--card2:#1f1f29;--tx:#f4f4f6;--mu:#8b8b99;--ac:#c8ff4d;--acx:#10140a;--ok:#4cff7a;--no:#ff5a5f;--cy:#4dffdf;

:root[data-theme="light"]{--bg:#f5f5f8;--card:#fff;--card2:#ecedf3;--tx:#14141c;--mu:#6b6b7a;--ac:#6d4aff;--acx:#fff}
html,body{margin:0;height:100%}*{box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:520px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:26px;margin:4px 0 2px}h2{font-size:20px;margin:18px 0 10px}.mu{color:var(--mu);font-size:14px}
.card{background:var(--card);border-radius:20px;padding:18px;margin:10px 0;box-shadow:0 2px 12px #0003}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:15px;font-size:16px;font-weight:700;background:var(--ac);color:var(--acx);cursor:pointer;margin:8px 0;transition:transform .1s}
.btn:active{transform:scale(.98)}.btn.g{background:var(--card2);color:var(--tx)}
.row{display:flex;gap:10px}.row>*{flex:1}
.big{font-size:38px;font-weight:800;text-align:center;margin:10px 0}
.opt{display:block;width:100%;text-align:left;background:var(--card2);color:var(--tx);border:2px solid transparent;border-radius:14px;padding:14px;margin:8px 0;font-size:16px;cursor:pointer}
.opt.ok{border-color:var(--ok)}.opt.no{border-color:var(--no)}
input,textarea{width:100%;background:var(--card2);color:var(--tx);border:0;border-radius:14px;padding:14px;font-size:16px;font-family:inherit}
textarea{min-height:120px}
.bar{height:10px;background:var(--card2);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ac);border-radius:9px;transition:width .6s}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:var(--card);border-radius:18px;padding:14px}.stat b{font-size:26px;display:block}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}.chip{background:var(--card2);border:0;color:var(--tx);border-radius:20px;padding:8px 14px;white-space:nowrap}.chip.on{background:var(--ac);color:var(--acx)}
.w{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid var(--card2)}
.sp{background:var(--card2);border:0;color:var(--tx);border-radius:50%;width:42px;height:42px;font-size:18px;cursor:pointer;flex:none}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--card2)}

 if(!w)return`<h1>Tayyor! 🎉</h1><div class="card">Hozircha takrorlash yoki yangi soʻz yoʻq.</div><button class="btn" onclick="go('books')">Kitoblarga oʻtish</button>`;
 const k=w.box<0?"Yangi soʻz":isDue(w)?"Takrorlash":"";
 return`<div class="mu">${esc(w.unit)} · ${k}</div><div class="card"><div class="big">${esc(w.en)}</div>
 <div style="text-align:center"><button class="sp" onclick="speak('${esc(w.en).replace(/'/g,"\\'")}')">🔊</button></div>
 ${L.show?`<div class="big" style="font-size:24px;color:var(--ac)">${esc(w.uz)}</div>${w.mn?`<div class="mu" style="text-align:center">💡 ${esc(w.mn)}</div>`:""}${w.ex?`<div class="mu" style="text-align:center;margin-top:6px"><i>${esc(w.ex)}</i></div>`:""}`:`<div class="mu" style="text-align:center;margin-top:12px">Avval maʼnosini eslab koʻring…</div>`}</div>
 ${L.show?`<div class="row"><button class="btn g" onclick="rate(0)">Mashq kerak</button><button class="btn" onclick="rate(1)">Esladim</button></div>`
 :`<button class="btn" onclick="L.show=1;speak(L.w.en);render()">Tarjimani koʻrsatish</button>`}`}
window.rate=g=>{grade(L.w,g);L={};render()};
function prac(){if(!P.mode)return`<h1>Mashq</h1><div class="mu">Faol eslab qolish — javobni oʻzingiz topasiz.</div>
 ${S.words.length<3?`<div class="card">Kamida 3 ta soʻz kerak.</div>`:[["audio","🔊 Audio: eshit va maʼnosini top"],["tr","🔤 Tarjima: inglizcha soʻzni tanla"],["spell","✍️ Imlo: inglizcha yozing"],["sent","🧩 Gap: boʻsh joyni toʻldiring"]].map(m=>`<button class="btn g" onclick="P.mode='${m[0]}';render()">${m[1]}</button>`).join("")}`;
 const pool=P.mode=="sent"?sc().filter(x=>x.ex&&x.ex.toLowerCase().includes(x.en.toLowerCase())):sc();if(!pool.length)return`<button class="chip" onclick="go('prac')">← Rejimlar</button><div class="card">Gap rejimi uchun Bu rejim uchun misol gaplari bor soʻzlar kerak.</div>`;const w=P.w||(P.w=choose(pool));
 let body="";const m=P.mode;
 if(m=="audio"){P.o=P.o||opts(w,"uz");body=`<div class="card" style="text-align:center"><button class="sp" style="width:72px;height:72px;font-size:30px" onclick="speak('${esc(w.en).replace(/'/g,"\\'")}')">🔊</button><div class="mu">Nimani eshityapsiz?</div></div>`+P.o.map(o=>`<button class="opt ${P.done?(o.id==w.id?"ok":P.pk==o.id?"no":""):""}" onclick="ans(${o.id})">${esc(o.uz)}</button>`).join("");if(!P.sp){P.sp=1;setTimeout(()=>speak(w.en),300)}}
 else if(m=="sent"){P.o=P.o||opts(w,"en");const ix=w.ex.toLowerCase().indexOf(w.en.toLowerCase()),bl=w.ex.slice(0,ix)+"_____"+w.ex.slice(ix+w.en.length);body=`<div class="card"><div class="mu">Boʻsh joyga mos soʻzni tanlang:</div><div style="font-size:20px;margin-top:8px">${esc(bl)}</div><div class="mu" style="margin-top:6px">${esc(w.uz)}</div></div>`+P.o.map(o=>`<button class="opt ${P.done?(o.id==w.id?"ok":P.pk==o.id?"no":""):""}" onclick="ans(${o.id})">${esc(o.en)}</button>`).join("")}
 else if(m=="tr"){P.o=P.o||opts(w,"en");body=`<div class="card"><div class="mu">Inglizcha soʻzni toping:</div><div class="big" style="font-size:26px">${esc(w.uz)}</div></div>`+P.o.map(o=>`<button class="opt ${P.done?(o.id==w.id?"ok":P.pk==o.id?"no":""):""}" onclick="ans(${o.id})">${esc(o.en)}</button>`).join("")}
 else body=`<div class="card"><div class="mu">Inglizcha yozing:</div><div class="big" style="font-size:26px">${esc(w.uz)}</div></div><input id="sp" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="English word…" ${P.done?"disabled":""} value="${esc(P.val||"")}">${P.done?"":`<button class="btn" onclick="spell()">Tekshirish</button>`}`;
 const fb=P.done?`<div class="card" style="border:2px solid var(--${P.good?"ok":"no"})">${P.good?"✅ Toʻgʻri!":"❌ Xato. Toʻgʻri javob: <b>"+esc(w.en)+"</b> — "+esc(w.uz)}</div><button class="btn" onclick="nx()">Davom etish</button>`:"";
 return`<button class="chip" onclick="go('prac')">← Rejimlar</button>${body}${fb}`}
window.ans=id=>{if(P.done)return;P.pk=id;P.good=id==P.w.id;P.done=1;grade(P.w,P.good);render()};
window.spell=()=>{const v=$("#sp").value.trim();if(!v)return;P.val=v;P.good=v.toLowerCase()==P.w.en.toLowerCase();P.done=1;grade(P.w,P.good);render()};
window.nx=()=>{const m=P.mode;P={mode:m};render();const i=$("#sp");if(i)i.focus()};
window.rs=()=>{try{const o=JSON.parse($('#bk').value);if(!Array.isArray(o.words))throw 0;S=o;save();render();toast("Tiklandi")}catch(e){toast("Zaxira notoʻgʻri")}};
function me(){const dn=S.words.filter(w=>status(w)=="done").length,tot=S.words.reduce((a,w)=>a+w.ok,0),B=[["🌱","Birinchi 10 toʻgʻri javob",tot>=10],["📘","10 soʻz oʻrganildi",dn>=10],["🔥","7 kunlik streak",S.streak>=7],["⭐","500 XP",S.xp>=500],["🏆","Bir kunda 30 ta javob",(S.best||0)>=30]];return`<h1>Profil</h1><div class="card"><div class="mu">Eng yaxshi kun: ${S.best||0} ta javob</div>${B.map(b=>`<div class="w"><span>${b[0]} ${b[1]}</span><span>${b[2]?"✅":"🔒"}</span></div>`).join("")}</div><div class="card"><div class="mu">Kunlik maqsad (soʻz)</div><div class="row" style="align-items:center"><button class="btn g" onclick="S.goal=Math.max(5,S.goal-5);save();render()">−</button><div class="big" style="margin:0">${S.goal}</div><button class="btn g" onclick="S.goal+=5;save();render()">+</button></div></div>
 <div class="card"><div class="mu">Mavzu</div><div class="row">${[["auto","Avto"],["dark","Qorongʻi"],["light","Yorugʻ"]].map(t=>`<button class="btn ${S.theme==t[0]?"":"g"}" onclick="S.theme='${t[0]}';save();render()">${t[1]}</button>`).join("")}</div></div>
 <div class="card"><div class="mu">Maʼlumotlar shu qurilma brauzerida saqlanadi. Hisob va bulutli sinxronlash hali yoʻq.</div>
 <button class="btn g" onclick="if(confirm('Barcha progress oʻchadi. Davom etasizmi?')){S.words.forEach(w=>{w.box=-1;w.ok=w.bad=w.st=0;w.due=0});S.xp=0;S.streak=0;S.log={};save();render()}">Progressni tiklash</button></div><div class="card"><div class="mu">Zaxira nusxa</div><textarea id="bk" placeholder="Zaxira shu yerda chiqadi yoki oldingi zaxirani joylashtiring"></textarea><div class="row"><button class="btn g" onclick="$('#bk').value=JSON.stringify(S)">Zaxira olish</button><button class="btn g" onclick="rs()">Tiklash</button></div></div>`}
if(!S.seeded&&!S.words.length){addWords(SEED);S.seeded=1;save()}
S.packs=S.packs||[];for(const k in PACKS)if(!S.packs.includes(k)){addWords(PACKS[k]);S.packs.push(k)}save();
render();
</script></body></html>
